# ==========================================
# CI — Build, test, lint và kiểm tra Docker build
# Chạy trên mọi nhánh khi push và mọi PR vào main.
# ==========================================
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "scripts/**"
      - "*.csv"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Backend: Spring Boot ───────────────────────────────────
  backend:
    name: Backend (build + test + coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # publish test report
      pull-requests: write   # comment coverage lên PR
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test (mvn verify)
        run: ./mvnw -B -ntp verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: Backend unit tests
          detailed_summary: true

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
              END {
                printf "### 📊 Backend coverage (JaCoCo)\n\n| Metric | Covered | Total | %% |\n|---|---|---|---|\n";
                printf "| Lines | %d | %d | %.1f%% |\n", lc, lc+lm, (lc+lm)?100*lc/(lc+lm):0;
                printf "| Branches | %d | %d | %.1f%% |\n", bc, bc+bm, (bc+bm)?100*bc/(bc+bm):0;
              }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Giai đoạn 1: chỉ báo cáo (không fail build).
      # Ngưỡng dưới đây chỉ hiển thị ✅/❌ trong comment PR.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-lines: 60
          title: "📊 Backend Coverage"
          update-comment: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          retention-days: 14

  # ─── Frontend: React + Vite ─────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type-check & build
        run: npm run build

  # ─── Docker: đảm bảo image build được (không push) ──────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ai-shopping-agent-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
