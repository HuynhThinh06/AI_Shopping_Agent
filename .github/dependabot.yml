# Dependabot — tự động mở PR cập nhật dependency hàng tuần.
# Minor/patch được gom thành 1 PR mỗi hệ sinh thái để giảm nhiễu.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
