spring.application.name=shopping-agent

# ==========================================
# DATABASE — Neon Serverless PostgreSQL
# Dùng Pooler endpoint (cổng 6543) để tránh vượt connection limit
# Connection string lấy từ Neon Console → Connection Details
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}/\
${DB_NAME:shopping_agent}?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — giới hạn pool cho Neon free tier (max 100 connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Giữ kết nối không bị đóng do Neon auto-suspend
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-init-sql=SELECT 1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# LLM
# ==========================================
llm.provider=${LLM_PROVIDER:gemini}
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
llm.gemini.max-retries=2
llm.gemini.timeout-seconds=30

# ==========================================
# CLOUDINARY
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==========================================
# RANKING WEIGHTS (fallback nếu DB trống)
# ==========================================
ranking.default.weight.price=0.35
ranking.default.weight.spec-match=0.45
ranking.default.weight.rating=0.20

# ==========================================
# SERVER
# ==========================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# SPRINGDOC / SWAGGER
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
