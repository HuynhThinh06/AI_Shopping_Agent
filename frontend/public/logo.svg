<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Warm Yellow Background -->
  <defs>
    <linearGradient id="warmYellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="url(#warmYellowGradient)" />
  
  <!-- Top-Right Accent Dot (Butter Yellow) -->
  <circle cx="73" cy="22" r="7.5" fill="#FEF3C7" fill-opacity="0.9" />
  
  <!-- Bottom-Left Accent Dot (Butter Yellow) -->
  <circle cx="23" cy="69" r="6.5" fill="#FEF3C7" fill-opacity="0.9" />
  
  <!-- 4-Pointed Sparkle Star (Crisp White) -->
  <path d="M 50 10 
           Q 52 35, 82 43 
           Q 52 51, 50 75 
           Q 48 51, 18 43 
           Q 48 35, 50 10 Z" 
        fill="#FFFFFF" />
        
  <!-- Friendly Smile Arc (Crisp White with rounded caps) -->
  <path d="M 28 81 Q 50 93 72 81" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        fill="none" />
</svg>
