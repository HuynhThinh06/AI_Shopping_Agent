<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Shopping Agent — Trợ lý Mua sắm Thông minh</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN with Soft-Brutalist Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },
            colors: {
              warm: {
                bg: '#FAF8F5',
                'bg-alt': '#FDFBF7',
                subtle: '#F5EFE6',
                surface: '#FFFFFF',
                'surface-soft': '#FBF9F5',
                border: '#292524',
                'border-subtle': '#E7DFCE',
                primary: '#F59E0B',
                'primary-hover': '#D97706',
                'primary-dark': '#B45309',
                'primary-text': '#451A03',
                accent: '#FBBF24',
                secondary: '#FEF3C7',
                'secondary-text': '#92400E',
                text: '#292524',
                muted: '#78716C',
                hint: '#A8A29E',
                'pastel-peach': '#FFEDD5',
                'pastel-sky': '#E0F2FE',
                'pastel-mint': '#DCFCE7',
                'pastel-lavender': '#F3E8FF',
                'pastel-amber': '#FEF3C7',
              }
            },
            boxShadow: {
              'brutal-xs': '1.5px 1.5px 0px #292524',
              'brutal-sm': '2px 2px 0px #292524',
              'brutal': '4px 4px 0px #292524',
              'brutal-md': '5px 5px 0px #292524',
              'brutal-lg': '6px 6px 0px #292524',
              'brutal-xl': '8px 8px 0px #292524',
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '18px',
              '3xl': '24px',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-warm-bg text-warm-text font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
